name: RAG Pipeline CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: rag-pipeline
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Style Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linting tools
        run: pip install flake8 black

      - name: Run flake8
        run: flake8 src/rag_pipeline/ tests/ --max-line-length=100 --ignore=E203,W503

      - name: Check black formatting
        run: black --check --line-length=100 src/rag_pipeline/ tests/

  test:
    name: Unit Tests (Python 3.11)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run pytest with coverage
        env:
          PYTHONPATH: src
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --cov=rag_pipeline.pipeline \
            --cov=rag_pipeline.vector_store \
            --cov=rag_pipeline.document_processor \
            --cov=rag_pipeline.response_generator \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            --junitxml=test-results.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  docker-build:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        run: |
          docker build \
            --target test \
            --tag ${{ env.IMAGE_NAME }}:test \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .

      - name: Build production image
        run: |
          docker build \
            --target app \
            --tag ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --tag ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Run health check
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:latest python scripts/healthcheck.py

      - name: Run docker-compose test service
        run: |
          docker compose run --rm rag-test
